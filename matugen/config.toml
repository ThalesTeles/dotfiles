[config]
# If set to enabled, it will check for updates when you run the matugen command, notifying you that an update is avaiable.
# WARNING: Matugen needs to be compiled with the `update-informer` feature for this to work.
version_check = false

# The color which should be used as the source_color if no good color was found from an image.
# Can be defined in any css format.
# The cli flag will override this if used.
fallback_color = "#f8f411"

reload_on_change = true
# Which color to choose if multiple good colors were found from an image.
# choices: [darkness, lightness, saturation, less-saturation, value, closest-to-fallback]
# The cli flag will override this if used.
prefer = "darkness"

[config.wallpaper]
# Whether to set the wallpaper or not
set = true

command = "hyprctl hyprpaper wallpaper ', {{image}}'"

# For example, killing the wallpaper daemon. Usage is like a normal hook.
# pre_hook = ""

[config.commands]
on_finish = "killall -SIGUSR2 dunst/"

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland_colors.conf'
output_path = '~/.config/hypr/colors.lua'
post_hook = 'hyprctl reload'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock_input_field.conf'
output_path = '~/.config/hypr/hyprlock_input_field.conf'

[templates.hyprlock_colors]
input_path = '~/.config/matugen/templates/hyprlock_colors.conf'
output_path = '~/.config/hypr/colors.conf'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty_colors.conf'
output_path = '~/.config/kitty/colors.conf'
post_hook = 'pkill -SIGUSR1 kitty'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi_colors.rasi'
output_path = '~/.config/rofi/colors/matugen.rasi'

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.dunst]
input_path = "~/.config/matugen/templates/dunstrc.conf"
output_path = "~/.config/dunst/dunstrc"
post_hook = 'dunstctl reload'

[templates.wlogout]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/wlogout/colors.css'
