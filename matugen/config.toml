[config]
# ...
reload_on_change = true

[config.wallpaper]
# Whether to set the wallpaper or not
set = true

# The base command to run for applying the wallpaper, shouldn't have spaces in it.
command = "sh"

# The arguments that will be provided to the command.
# Keywords like {{ mode }} or anything that works inside of hooks doesn't work here.
# The last argument will be the image path.
arguments = ["-c", "hyprctl hyprpaper reload ,\"$0\""]

# For example, killing the wallpaper daemon. Usage is like a normal hook.
# pre_hook = ""

[config.commands]
on_finish = "killall -SIGUSR2 dunst/"

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland_colors.conf'
output_path = '~/.config/hypr/colors.conf'
post_hook = 'hyprctl reload'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock_input_field.conf'
output_path = '~/.config/hypr/hyprlock_input_field.conf'
post_hook = 'hyprctl reload'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty_colors.conf'
output_path = '~/.config/kitty/colors.conf'
post_hook = 'pkill -SIGUSR1 kitty'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi_colors.rasi'
output_path = '~/.config/rofi/colors/matugen.rasi'

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.dunst]
input_path = "~/.config/matugen/templates/dunstrc.conf"
output_path = "~/.config/dunst/dunstrc"
post_hook = 'dunstctl reload'

[templates.wlogout]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/wlogout/colors.css'