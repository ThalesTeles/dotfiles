# Perfil do modo Economia (copiado para /etc/auto-cpufreq.conf pelo modo-energia.sh)
[charger]
governor = performance
turbo = auto

# No modo Economia o auto-cpufreq usa esta seção mesmo na tomada
[battery]
governor = powersave
# Perfil mais econômico da CPU e sem turbo
energy_performance_preference = power
turbo = never
# Limita a 1,4GHz (máximo da CPU sem turbo: 1,8GHz)
scaling_max_freq = 1400000
