input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    fade_on_empty = false
    rounding = -1
    position = 0, -200
    halign = center
    valign = center
    hide_input = false

    # O Matugen vai escrever o código da cor direto aqui, sem variáveis ($)
    placeholder_text = <i><span foreground="##100e07FF"><b>Password...</b></span></i>
    fail_text = <span foreground="##ffb4abFF"><i>$FAIL <b>($ATTEMPTS)</b></i></span>
    
    outer_color = #dfc56d
    check_color = #abd0b1
    fail_color = #ffb4ab
    
    inner_color = #100e07FF
    font_color = #e9e2d4
}