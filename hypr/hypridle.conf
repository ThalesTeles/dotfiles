# hypridle: o que fazer quando o computador fica sem uso (sem teclado e mouse).
# Iniciado pelo autostart do hyprland.lua. Respeita inibidores: vídeo em tela cheia
# e o botão "não suspender" da waybar (idle_inhibitor) pausam todas as etapas abaixo.

general {
    lock_cmd = pidof hyprlock || hyprlock                             # evita abrir dois hyprlock
    before_sleep_cmd = loginctl lock-session                          # bloqueia antes de suspender
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # religa a tela ao voltar da suspensão
}

# 2,5 min: escurece a tela (o -s guarda o brilho atual e o -r restaura ao mexer no mouse)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%; pkill -RTMIN+10 -x waybar
    on-resume = brightnessctl -r; ~/.config/hypr/scripts/modo-energia.sh reaplicar
}

# 5 min: bloqueia a tela
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5,5 min: desliga a tela
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 15 min: suspende, só se estiver na bateria (na tomada o computador fica ligado)
listener {
    timeout = 900
    on-timeout = [ "$(cat /sys/class/power_supply/ADP0/online)" = 0 ] && systemctl suspend
}
